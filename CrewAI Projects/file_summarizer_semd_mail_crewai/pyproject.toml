[project]
name = "file_summarizer"
version = "0.1.0"
description = "file_summarizer using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.28,<2.0.0",
]

[project.scripts]
file_summarizer = "file_summarizer.main:run"
run_crew = "file_summarizer.main:run"
train = "file_summarizer.main:train"
replay = "file_summarizer.main:replay"
test = "file_summarizer.main:test"
run_with_trigger = "file_summarizer.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "b1c6065e-8042-4f8c-9203-e62a54bb9f1e"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
