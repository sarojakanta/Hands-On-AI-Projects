[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-assistant"
version = "0.1.0"
description = "A LangGraph assistant with web search and weather agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
multi-agent-assistant = "multi_agent_assistant.cli:main"
multi-agent-assistant-web = "multi_agent_assistant.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_agent_assistant = ["templates/*.html", "static/*.css", "static/*.js"]
