version: '3.8'

services:
  # Application
  app:
    build: ../../product-machine/application/app
    container_name: product-01-app
    environment:
      - MACHINE_ID=product-01
      - OTEL_ENDPOINT=otel-collector:4317
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/productdb
      - REDIS_URL=redis://redis:6379
    ports:
      - "8001:8000"
    networks:
      - product-01
      - monitoring
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - app-logs:/var/log/application

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: product-01-nginx
    volumes:
      - ../../product-machine/application/config/nginx.conf:/etc/nginx/nginx.conf
      - nginx-logs:/var/log/nginx
    ports:
      - "8080:80"
    networks:
      - product-01
    depends_on:
      - app
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: product-01-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=productdb
    volumes:
      - ../../product-machine/application/config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - product-01
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB

  # Redis
  redis:
    image: redis:7-alpine
    container_name: product-01-redis
    networks:
      - product-01
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Node Exporter - Linux metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: product-01-node-exporter
    ports:
      - "9100:9100"
    networks:
      - product-01
      - monitoring
    restart: unless-stopped

  # Postgres Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: product-01-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/productdb?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - product-01
      - monitoring
    depends_on:
      - postgres
    restart: unless-stopped

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: product-01-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - product-01
      - monitoring
    depends_on:
      - redis
    restart: unless-stopped

  # Nginx Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: product-01-nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx/nginx_status'
    ports:
      - "9113:9113"
    networks:
      - product-01
      - monitoring
    depends_on:
      - nginx
    restart: unless-stopped

  # Grafana Alloy - Log collection
  alloy:
    image: grafana/alloy:latest
    container_name: product-01-alloy
    environment:
      - MACHINE_ID=product-01
    volumes:
      - ../../product-machine/instrumentation/grafana-alloy/config.alloy:/etc/alloy/config.alloy
      - app-logs:/var/log/application:ro
      - nginx-logs:/var/log/nginx:ro
    networks:
      - product-01
      - monitoring
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345

networks:
  product-01:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.1.0/24
  monitoring:
    external: true
    name: deployment_monitoring

volumes:
  postgres-data:
  app-logs:
  nginx-logs:
